name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server tests (API + WebSocket + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rec
          POSTGRES_PASSWORD: rec
          POSTGRES_DB: rec_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rec" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgresql://rec:rec@localhost:5432/rec_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - name: Same tests on the built-in database (one-PC mode)
        run: npm test
        env:
          TEST_DB: builtin

  web:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  agent:
    name: Agent tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  installers:
    name: Installer scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell installers
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem agent/install/windows/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($f.Name): $($_.Message)" }; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Shellcheck
        shell: bash
        run: |
          pip install -q shellcheck-py
          shellcheck -S warning install.sh agent/install/linux/*.sh
